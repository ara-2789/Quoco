name: CI

# STAGE 1 of the process-hardening work order's P2 (CI gates) — typecheck,
# lint, test. LOAD-BEARING as of 2026-08-07: branch protection on main
# requires all three (Typecheck / Lint / Test (real test-db)), flipped on
# as its own separate, dated decision after the red/green acceptance
# criterion in docs/reviews/p2-ci-gates.md §2 was actually observed, not
# assumed.
#
# STAGE 2 (migration-lint) is new here and NOT yet required by branch
# protection — same non-blocking-first rollout as stage 1: land it, prove
# it with its own red/green acceptance criterion (docs/reviews/p2-ci-gates.md),
# THEN a separate branch-protection update adds it to the required list.
#
# file-size-lint (2026-08-22, CLAUDE.md §0's "FILE SIZE LIMITS" standing
# rule) follows the SAME non-blocking-first rollout, for a concrete reason,
# not just consistency: CLAUDE.md is already over this job's own 140,000-char
# hard-fail threshold on the day this job was added (169,325 chars — see
# docs/reviews/claude-md-rule-inventory-2026-08-22.md), so this job reports
# FAIL from its first run, on every PR, until CLAUDE.md is actually split.
# Adding it to required checks now would block ALL merges to main, including
# the split itself, until the split happens — the exact kind of deadlock a
# hard gate should never create. It stays non-required until CLAUDE.md is
# back under 140,000 chars, at which point a separate branch-protection
# update can add it (matching the same two-step precedent stage 1 already
# used to promote migration-lint... except migration-lint WAS added as
# required once proven green; this one is added as required once the
# pre-existing violation it's watching for is actually cleared).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # DOCS-ONLY PATH FILTER for the "Test (real test-db)" job ONLY (2026-09-08).
  # "Test (real test-db)" is a REQUIRED status check on main (confirmed live
  # against `gh api repos/.../branches/main/protection` before writing this,
  # not assumed) -- a plain workflow-level `paths-ignore` would leave it
  # permanently pending for a docs-only PR and BLOCK the merge, not allow it.
  # This job classifies the PR's changed files; the `test` job below is
  # gated on its output with a job-level `if:`, which reports the job as
  # "skipped" rather than never appearing -- GitHub's documented behavior is
  # that a skipped required check satisfies branch protection (this is
  # NOT independently re-verified against THIS repo yet; the first
  # genuinely docs-only PR opened after this ships is the real confirmation
  # -- watch for it, per CLAUDE.md §0's "verified by observation" rule, not
  # trusted on the strength of this comment alone).
  #
  # Skip set: docs/** (recursive) and *.md AT REPO ROOT ONLY (matched as
  # "no '/' in the path, ends in .md" -- deliberately NOT `**/*.md`, so a
  # markdown file under scripts/, test/, or anywhere else still counts as
  # non-doc and forces the real test run). Every other path -- scripts/**,
  # supabase/migrations/**, types/**, .github/**, test/**, app/**, lib/**
  # included -- falls through to "non-doc" by construction, not via an
  # explicit denylist; there is no glob broad enough here to accidentally
  # catch them.
  #
  # Only applies to pull_request; a direct push to main always runs the
  # full suite regardless of what changed (`test`'s own `if:` short-
  # circuits on `github.event_name != 'pull_request'` before ever
  # consulting this job's output).
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # ADDED 2026-09-15, per-job, ref-scoped, safe to cancel: this job is a
    # stateless read of the PR's own file list -- no shared mutable
    # resource, no cleanup step, nothing a cancelled run could strand. See
    # the `test` job's own concurrency block below for the DIFFERENT case
    # (a job that MUST NOT be given cancel-in-progress) and why the two
    # are not treated the same way.
    concurrency:
      group: ci-changes-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          FILES=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          echo "Changed files:"
          echo "$FILES"

          docs_only=true
          if [ -z "$FILES" ]; then
            # No file list at all -- fail SAFE toward running the real
            # suite, never toward skipping it.
            docs_only=false
          fi
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [[ "$f" == docs/* ]]; then
              continue
            fi
            if [[ "$f" != */* && "$f" == *.md ]]; then
              continue
            fi
            docs_only=false
            break
          done <<< "$FILES"

          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    # ADDED 2026-09-15, per-job, ref-scoped, safe to cancel: a pure
    # `tsc --noEmit` run against the checked-out code, no shared mutable
    # resource, no cleanup step to strand. Own group, separate from every
    # other job's, so a new Typecheck run only supersedes an older
    # Typecheck run, never a different job.
    concurrency:
      group: ci-typecheck-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Confirmed 2026-08-07 against Vercel → Settings → Build and
          # Deployment → Node.js Version = 24.x. Also in .nvmrc at the repo
          # root; re-check both if either ever needs to change, since
          # neither can drift from the other or from what Vercel actually
          # builds with without silently invalidating this gate.
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # ADDED 2026-09-15 -- see `typecheck`'s own comment above for the
    # reasoning (stateless, nothing to strand, own group).
    concurrency:
      group: ci-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  migration-lint:
    name: Migration Lint
    runs-on: ubuntu-latest
    # ADDED 2026-09-15 -- see `typecheck`'s own comment above for the
    # reasoning (stateless, nothing to strand, own group).
    concurrency:
      group: ci-migration-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:migrations

  file-size-lint:
    name: File Size Lint
    runs-on: ubuntu-latest
    # ADDED 2026-09-15 -- see `typecheck`'s own comment above for the
    # reasoning (stateless, nothing to strand, own group).
    concurrency:
      group: ci-file-size-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:filesize

  fixture-literal-lint:
    name: Fixture Literal Lint
    runs-on: ubuntu-latest
    # ADDED 2026-09-15 -- see `typecheck`'s own comment above for the
    # reasoning (stateless, nothing to strand, own group).
    concurrency:
      group: ci-fixture-literal-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:fixture-literals

  # SKIP THE test-db JOB ON A push TO main WHEN THE PUSHED COMMIT IS A MERGE
  # OF A PR ALREADY PROVEN GREEN AT THE SAME SHA (2026-09-17, Aravind). The
  # `test` job's own concurrency comment above (the PR #275 incident) names
  # the real fix as deduplication at the trigger level, not a concurrency
  # policy -- this job is that fix. A `push` to main that is exactly a
  # "Require branches to be up to date before merging" merge commit re-runs
  # the identical tree that the merged PR's own `pull_request` run already
  # tested; re-running the full test-db suite a second time for that same
  # tree buys nothing and re-queues behind `ci-test-db-suite` for no reason.
  # This relies on that branch-protection setting being ON for main -- it is
  # what guarantees a merge commit's tree matches its PR head's tree in the
  # common case this job is built to catch (see the tree-check step below,
  # which verifies this directly rather than trusting the setting alone).
  #
  # Conservative by construction, fails toward RUNNING the suite: any of
  # (a) no exactly-one merged PR at this merge commit, (b) that PR's head
  # tree differs from this commit's tree, (c) no run of this workflow at
  # that PR head concluded success with `Test (real test-db)` itself
  # concluding success (not skipped), or any command error/unexpected API
  # response along the way, leaves `skip=false` and the full suite runs.
  # Only applies to `push`; `pull_request` runs are untouched (the `test`
  # job's own `if:` below only consults this job's output on non-PR events).
  skip-duplicate-main-run:
    name: Detect already-green PR head
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for identical, already-green PR head
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set +e

          finish() {
            echo "$2"
            echo "skip=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # a. PR lookup: the merged PR whose merge_commit_sha == this push's sha.
          PR_JSON=$(gh api "repos/${REPO}/commits/${SHA}/pulls" 2>&1)
          if [ $? -ne 0 ]; then
            finish false "gh api commits/${SHA}/pulls failed: $PR_JSON"
          fi

          MATCHING=$(echo "$PR_JSON" | jq -c --arg sha "$SHA" '[.[] | select(.merge_commit_sha == $sha and .merged_at != null)]' 2>&1)
          if [ $? -ne 0 ]; then
            finish false "jq filter on PR list failed: $MATCHING"
          fi

          COUNT=$(echo "$MATCHING" | jq 'length' 2>&1)
          if [ "$COUNT" != "1" ]; then
            finish false "Expected exactly one merged PR with merge_commit_sha == ${SHA}, found ${COUNT}."
          fi

          PR_NUMBER=$(echo "$MATCHING" | jq -r '.[0].number')
          PR_HEAD_SHA=$(echo "$MATCHING" | jq -r '.[0].head.sha')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ] || [ -z "$PR_HEAD_SHA" ] || [ "$PR_HEAD_SHA" == "null" ]; then
            finish false "Could not extract PR number/head sha from matched PR object: $MATCHING"
          fi

          echo "Found merged PR #${PR_NUMBER}, head ${PR_HEAD_SHA}, merge commit ${SHA}."

          # b. Tree check.
          if ! git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$PR_HEAD_SHA" 2>&1
          fi
          if ! git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null; then
            finish false "Could not resolve PR #${PR_NUMBER} head commit ${PR_HEAD_SHA} locally after fetch attempt."
          fi

          MAIN_TREE=$(git rev-parse "${SHA}^{tree}" 2>&1)
          if [ $? -ne 0 ]; then
            finish false "git rev-parse on main sha ${SHA} tree failed: $MAIN_TREE"
          fi

          PR_TREE=$(git rev-parse "${PR_HEAD_SHA}^{tree}" 2>&1)
          if [ $? -ne 0 ]; then
            finish false "git rev-parse on PR head ${PR_HEAD_SHA} tree failed: $PR_TREE"
          fi

          if [ "$MAIN_TREE" != "$PR_TREE" ]; then
            finish false "Tree mismatch: main ${SHA} tree ${MAIN_TREE} != PR #${PR_NUMBER} head ${PR_HEAD_SHA} tree ${PR_TREE}."
          fi

          echo "Tree identical (${MAIN_TREE}) between main ${SHA} and PR #${PR_NUMBER} head ${PR_HEAD_SHA}."

          # c. Prior pass: a run of THIS workflow at the PR head that concluded
          # success, with the "Test (real test-db)" job itself concluding
          # success (not skipped).
          RUNS_JSON=$(gh api "repos/${REPO}/actions/runs?head_sha=${PR_HEAD_SHA}&event=pull_request" --paginate 2>&1)
          if [ $? -ne 0 ]; then
            finish false "gh api actions/runs lookup failed: $RUNS_JSON"
          fi

          SUCCESS_RUN_IDS=$(echo "$RUNS_JSON" | jq -r '.workflow_runs[]? | select(.name == "CI" and .conclusion == "success") | .id' 2>&1)
          if [ -z "$SUCCESS_RUN_IDS" ]; then
            finish false "No successful CI workflow run found for PR #${PR_NUMBER} head ${PR_HEAD_SHA}."
          fi

          found_run_url=""
          for run_id in $SUCCESS_RUN_IDS; do
            JOBS_JSON=$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs" --paginate 2>&1)
            if [ $? -ne 0 ]; then
              continue
            fi
            TEST_JOB_CONCLUSION=$(echo "$JOBS_JSON" | jq -r '[.jobs[]? | select(.name == "Test (real test-db)")][0].conclusion // empty')
            if [ "$TEST_JOB_CONCLUSION" == "success" ]; then
              found_run_url="https://github.com/${REPO}/actions/runs/${run_id}"
              break
            fi
          done

          if [ -z "$found_run_url" ]; then
            finish false "No run found where Test (real test-db) concluded success (not skipped) for PR #${PR_NUMBER} head ${PR_HEAD_SHA}."
          fi

          finish true "Skipping test-db on main: tree ${MAIN_TREE} identical to PR #${PR_NUMBER} head ${PR_HEAD_SHA}, already green in run ${found_run_url}."

  test:
    name: Test (real test-db)
    needs: [changes, skip-duplicate-main-run]
    # `always()` overrides the default "skip if a needed job was skipped"
    # behavior -- `changes` itself is skipped (by its own `if:`) on a push
    # event, and `skip-duplicate-main-run` itself is skipped on a
    # pull_request event, and without `always()` here that would cascade
    # into skipping this job's condition evaluation entirely rather than
    # reaching the branches below.
    if: >-
      always() &&
      ((github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true') ||
      (github.event_name != 'pull_request' && needs.skip-duplicate-main-run.outputs.skip != 'true'))
    runs-on: ubuntu-latest
    # DO NOT add ${{ github.ref }} (or anything branch/PR-scoped) to the
    # group below. That is the standard GitHub Actions idiom elsewhere, and
    # it is WRONG here specifically: the fixtures this suite writes to
    # (TEST_TENANT_ID, TEST_PROJECT_ID, TEST_ENGINEER_PHONE — fixed,
    # deterministic UUIDs in test/helpers/db.ts, same rows regardless of
    # which branch runs) are shared PROJECT-WIDE, not per-branch. Two
    # DIFFERENT PRs' test jobs running at the same moment collide exactly
    # like two runs on the same branch would — a ref-scoped group would let
    # them run concurrently and corrupt each other's fixture state, which
    # is the one failure mode this concurrency block exists to prevent. The
    # fixed literal name below is what makes every run of this job, from
    # every branch and every trigger, queue behind whichever is already
    # running, project-wide.
    concurrency:
      group: ci-test-db-suite
      # NEVER true. Cancelling a run mid-suite skips afterEach/afterAll
      # cleanup (test/helpers/db.ts) and strands fixture rows in test-db —
      # queuing costs CI minutes; cancelling costs test-db integrity.
      #
      # DELIBERATELY LEFT UNTOUCHED, 2026-09-15, when cancel-in-progress
      # was added to every OTHER job in this file (each its own, ref-scoped
      # group -- see `typecheck`'s own comment above). This job cannot
      # safely get the same treatment, on EITHER axis: (1) scoping this
      # job's own GROUP by ref (rather than the fixed literal above) would
      # let two DIFFERENT PRs' test jobs run concurrently again -- the
      # exact bug this whole block exists to prevent, restated in the
      # comment two lines up; ref-scoping is not a smaller, safer version
      # of that fix, it IS that bug. (2) Flipping cancel-in-progress to
      # true, even leaving the group project-wide, would let a NEWER
      # trigger cancel an OLDER run mid-suite -- and because the fixtures
      # this suite writes are fixed, NON-ref-scoped literals (same UUIDs
      # regardless of which branch or run), a cancelled run's stranded rows
      # are not confined to its own branch either; a LATER run (on ANY
      # ref) can trip over them. Both failure modes are the same shape:
      # this job's own shared resource has no ref boundary, so no
      # ref-scoped concurrency policy is sound for it, in either direction.
      #
      # CONSEQUENCE, NAMED PLAINLY: the incident that prompted this pass
      # (two full runs at the identical head SHA, 23 minutes apart, on PR
      # #275) is NOT fixed by anything in this file. If both runs were
      # genuinely independent workflow runs for the same commit (a
      # duplicate `pull_request` webhook delivery, not a newer commit
      # superseding an older one), the safe fix is deduplicating at the
      # TRIGGER level -- e.g., skip re-running if this exact SHA already
      # has a completed, successful run -- not a concurrency/cancellation
      # policy on this job. That is a different kind of change (workflow
      # logic, not a concurrency block) and is not made here.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm test
        env:
          # test/setup/guard.ts hard-aborts the entire run unless these
          # resolve to the single allowed test-db project ref
          # (exfccwlrhoutkgrlikod) — this can never reach prod, even if a
          # secret here were misconfigured. .env.test itself is gitignored
          # and never present in a CI checkout. CORRECTED (2026-08-13): this
          # comment previously said loadDotenv() "no-ops" when the file is
          # absent — true for VALUES (these already-set process.env vars are
          # left untouched, so CI-native secret injection is the only real
          # source here, not a synthesized file) but not the whole story:
          # dotenv still logs its own rotating "// tip: ..." banner even when
          # the target file doesn't exist (checked against dotenv's own
          # source, lib/main.js — the log call has no file-found guard, only
          # a DOTENV_CONFIG_QUIET one). DOTENV_CONFIG_QUIET below silences it
          # here the same way .env.test's own copy of this var silences it
          # locally — two separate settings because CI never reads that file.
          #
          # SUPABASE_TEST_PROJECT_REF and NEXT_PUBLIC_APP_URL are not
          # actually sensitive (the ref is already public throughout this
          # repo's own docs; the URL is a fixed fake value,
          # https://test.invalid) — stored as secrets anyway for setup
          # uniformity with the four that are.
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_TEST_PROJECT_REF: ${{ secrets.SUPABASE_TEST_PROJECT_REF }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          DOTENV_CONFIG_QUIET: 'true'
